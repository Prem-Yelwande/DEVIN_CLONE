<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header id="navbar" class="container">
        <div class="logo">Brand</div>
        <button class="nav-toggle">Menu</button>
        <nav class="nav-menu">
            <ul>
                <li><a href="#hero">Hero</a></li>
                <li><a href="#features">Features</a></li>
                <li><a href="#pricing">Pricing</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section id="hero">
            <h1>Welcome to Our Platform</h1>
            <p>Building amazing things with modern tools.</p>
        </section>

        <section id="features">
            <div class="feature-card"><h3>Feature 1</h3><p>Description of feature one.</p></div>
            <div class="feature-card"><h3>Feature 2</h3><p>Description of feature two.</p></div>
            <div class="feature-card"><h3>Feature 3</h3><p>Description of feature three.</p></div>
        </section>

        <section id="pricing">
            <div class="pricing-card"><h3>Basic</h3><p>$10/mo</p></div>
            <div class="pricing-card"><h3>Pro</h3><p>$20/mo</p></div>
            <div class="pricing-card"><h3>Enterprise</h3><p>$50/mo</p></div>
        </section>
    </main>

    <footer id="footer" class="container">
        <p>&copy; 2023 Landing Page</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
